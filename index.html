<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
/* Layout: app de uma coluna para celular — cabeçalho curto, conteúdo em lista, barra de abas fixa embaixo. */
:root{
  --bg:#FAF6F5; --surface:#FFFFFF; --sunk:#F2EAEA; --ink:#2B1E24; --muted:#7B6A70; --line:#E8DCDD;
  --berry:#963A59; --berry-soft:#F6E3E9; --nude:#B8906C; --nude-soft:#F4EBE2;
  --ok:#3F7A5C; --ok-soft:#E3F0E8; --warn:#9A6A1E; --warn-soft:#F7EDD9;
  --display:"Lora",Georgia,"Times New Roman",serif;
  --body:"Manrope",-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151014; --surface:#1F181D; --sunk:#271E24; --ink:#F3EAED; --muted:#B3A2A8; --line:#3A2D35;
  --berry:#E48AA7; --berry-soft:#3A2230; --nude:#D6B08C; --nude-soft:#2F261F;
  --ok:#7FC39E; --ok-soft:#1E3027; --warn:#E3B567; --warn-soft:#33291A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151014; --surface:#1F181D; --sunk:#271E24; --ink:#F3EAED; --muted:#B3A2A8; --line:#3A2D35;
  --berry:#E48AA7; --berry-soft:#3A2230; --nude:#D6B08C; --nude-soft:#2F261F;
  --ok:#7FC39E; --ok-soft:#1E3027; --warn:#E3B567; --warn-soft:#33291A; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:18px 110px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:6px}
.brand{font-family:var(--display);font-weight:600;font-size:1.9rem;line-height:1;letter-spacing:.01em;margin:0}
.brand small{display:block;font-family:var(--body);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sync{font-size:.72rem;color:var(--muted);text-align:right}
.rule{margin:10px 0 18px;padding:10px 12px;border-left:3px solid var(--nude);background:var(--nude-soft);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:1.45rem;margin:26px 0 10px;text-wrap:balance}
h3{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:600}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.feature{background:var(--berry-soft);border-color:transparent}
.feature .when{color:var(--berry)}
.when{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.title{font-weight:600;font-size:1rem;margin:3px 0 8px;line-height:1.35}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:.7rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.A{background:var(--warn-soft);color:var(--warn)}
.chip.P{background:var(--sunk);color:var(--ink)}
.chip.T{background:var(--berry-soft);color:var(--berry)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
select{font:inherit;font-size:.78rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--surface);color:var(--ink);max-width:100%}
select.s4{background:var(--ok-soft);color:var(--ok);border-color:transparent}
select.s3{background:var(--berry-soft);color:var(--berry);border-color:transparent}
details{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
summary{cursor:pointer;font-size:.8rem;font-weight:600;color:var(--berry);list-style:none}
summary::-webkit-details-marker{display:none}
summary:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--berry);outline-offset:2px}
dl{margin:8px 0 0;display:grid;gap:8px}
dt{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
dd{margin:2px 0 0}
.hook{font-family:var(--body);font-weight:600;font-size:1.05rem;line-height:1.4}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:4px -16px 6px;padding-inline:16px;scrollbar-width:none}
.filters button{flex:none;font:inherit;font-size:.8rem;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.week{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:20px 0 8px;display:flex;justify-content:space-between}
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;background:var(--berry)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.num{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left}
.num b{display:block;font-family:var(--display);font-size:1.6rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.num span{font-size:.7rem;color:var(--muted);font-weight:600}
ul.plain{margin:6px 0 0;padding-left:18px}
ul.plain li{margin:3px 0}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;accent-color:var(--berry);flex:none;margin-top:1px}
.check label{min-width:0}
.check .sub{display:block;font-size:.75rem;color:var(--muted)}
.done label{color:var(--muted);text-decoration:line-through}
.idea-form{display:flex;flex-direction:column;gap:8px}
textarea{font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);color:var(--ink);min-height:80px;resize:vertical;width:100%}
.btn{font:inherit;font-weight:700;font-size:.85rem;border:0;border-radius:999px;padding:10px 16px;background:var(--berry);color:var(--bg);cursor:pointer;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--muted);padding:4px 8px;font-weight:600;font-size:.75rem}
.idea{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.idea p{margin:0;min-width:0;overflow-wrap:anywhere}
.idea time{display:block;font-size:.7rem;color:var(--muted);margin-top:4px}
.note{font-size:.8rem;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:.85rem}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{font-weight:700;white-space:nowrap;padding-left:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:640px;width:100%}
nav.tabs button{font:inherit;border:0;background:none;color:var(--muted);font-size:.68rem;font-weight:600;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:10px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
nav.tabs button[aria-current="page"]{color:var(--berry)}
.sess>summary{list-style:none;color:var(--ink);font-size:inherit;font-weight:inherit}
.sess .sess-body{margin-top:6px}
.rec dl{margin-top:10px}
.done-card{opacity:.6}
.file-btn{display:inline-block}
.callout{background:var(--nude-soft);border-left:3px solid var(--nude);padding:10px 12px;border-radius:8px;margin-top:10px;font-size:.88rem}
.login{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.login input{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink);width:100%}
.days{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.days button{flex:none;width:52px;font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;position:relative}
.days button span{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.days button b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.days button.today{border-color:var(--berry)}
.days button[aria-pressed="true"]{background:var(--berry);border-color:var(--berry);color:var(--bg)}
.days button[aria-pressed="true"] span{color:var(--bg)}
.days button i{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--nude)}
details.card>summary{cursor:pointer;font-weight:600;color:var(--ink);font-size:.9rem}
.swapbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.swapbox select{flex:1 1 200px;min-width:0;border-radius:10px}
.swapped-note{font-size:.75rem;color:var(--berry);font-weight:600}
.story .phrase{display:block;font-family:var(--body);font-weight:500;font-size:1.06rem;line-height:1.45;margin-top:4px;color:var(--ink)}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:.85rem;border:1px dashed var(--line);border-radius:var(--r)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
</head>

<div class="wrap">

    <h1 class="brand"><small>Isabella Handem · Beleza &amp; Negócios</small>Central de Conteúdo</h1>

  <div class="rule">Não produzir mais conteúdo do que a vida já está dando.</div>

  <main>

    <section id="v-cal" hidden></section>
    <section id="v-grav" hidden></section>
    <section id="v-stories" hidden></section>
    <section id="v-ideias" hidden></section>

</div>

</nav>

const BANKBY = Object.fromEntries(BANK.map(b=>[b.id,b]));
function swapOf(id){ const a=ck("troca-"+id); return a.length?BANKBY[a[0]]:null }
function resolved(i){ const b=swapOf(i.id); return b?{...i,t:b.t,f:b.f,o:b.o,h:b.h,dev:b.dev,c:b.c,q:b.q,x:"",p:b.serie,swapped:b,orig:i.t}:i }
let bankSerie="todas";
function bankSection(){
  const t=todayStr();
  const upcoming=ITEMS.filter(i=>i.d>=t && st(i.id)<4).slice(0,16);
  const used={}; ITEMS.forEach(i=>{const b=swapOf(i.id); if(b) used[b.id]=i});
  const series=["todas",...new Set(BANK.map(b=>b.serie))];
  const list=BANK.filter(b=>bankSerie==="todas"||b.serie===bankSerie);
  return `<h2>Banco de narrativas</h2>
    <p class="note">Se o post do dia não fizer sentido, troque por um daqui. A troca aparece no calendário e dá para desfazer.</p>
    <div class="filters" role="group" aria-label="Série">${series.map(s=>`<button type="button" data-bserie="${esc(s)}" aria-pressed="${bankSerie===s}">${s==="todas"?"Todas":esc(s)}</button>`).join("")}</div>
    <div class="stack">${list.map(b=>`<details class="card">
      <summary><div class="row"><span class="when">${esc(b.serie)}</span><span class="chip ${b.esf==="Ao vivo"?"A":b.esf==="15 min"?"T":"P"}">${esc(b.esf)}</span></div><div class="title" style="margin-bottom:0">${esc(b.t)}</div>${used[b.id]?`<div class="note">Usado no lugar de ${esc(used[b.id].n)} (${fmt(used[b.id].d)})</div>`:""}</summary>
      <dl><div><dt>Primeira frase</dt><dd class="hook">${esc(b.h)}</dd></div><div><dt>Formato</dt><dd>${esc(b.f)}</dd></div><div><dt>Desenvolvimento</dt><dd>${esc(b.dev)}</dd></div><div><dt>Cenas</dt><dd>${esc(b.c)}</dd></div><div><dt>Pergunta final</dt><dd>${esc(b.q)}</dd></div></dl>
      <div class="swapbox"><label class="note" for="sw-${b.id}">Usar no lugar de</label><select id="sw-${b.id}">${upcoming.map(i=>`<option value="${i.id}">${esc(i.n)} · ${fmt(i.d)} · ${esc(resolved(i).t.slice(0,38))}${resolved(i).t.length>38?"…":""}</option>`).join("")}</select><button class="btn" type="button" data-swap="${b.id}">Trocar</button></div>
    </details>`).join("")}</div>`;
}

const $ = s=>document.querySelector(s);

const fmt = s=>{const x=parse(s);return `${DOW[x.getDay()]} ${x.getDate()}/${x.getMonth()+1}`};

function statusSelect(i){
  const v = st(i.id);
  return `<select class="s${v}" data-st="${i.id}" aria-label="Status de ${esc(i.n)}">${STATUS.map((s,k)=>`<option value="${k}"${k===v?" selected":""}>${k===0?todoLabel(i):s}</option>`).join("")}</select>`;
}

function renderCal(){
  const fs = [["todos","Todos"],["P","Planejados"],["A","Ao vivo"],["T","Topo de funil"],["pend","Pendentes"]];
  let list = ITEMS.filter(i=> filter==="todos" || (filter==="T"? i.top : filter==="pend"? st(i.id)<4 : (i.k===filter && !i.top) ));
  const groups = {};
  list.forEach(i=>{const x=parse(i.d);const m=new Date(x);m.setDate(x.getDate()-((x.getDay()+6)%7));const k=`${m.getDate()}/${m.getMonth()+1}`;(groups[k]=groups[k]||[]).push(i)});
  $("#v-cal").innerHTML = `<h2>Calendário · 5/10 a 27/11</h2>
    <div class="filters" role="group" aria-label="Filtro">${fs.map(([k,l])=>`<button data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join("")}</div>
    ${Object.keys(groups).length? Object.entries(groups).map(([k,its])=>`<div class="week"><span>Semana de ${k}</span><span>${its.filter(i=>st(i.id)===4).length}/${its.length} no ar</span></div><div class="stack">${its.map(i=>card(i)).join("")}</div>`).join("") : `<div class="empty">Nada neste filtro.</div>`}`;
}

function capKeys(c){const T=TEMPLATES[c.tipo];return [...T.antes.map((_,k)=>"a"+k),...T.durante.map((_,k)=>"d"+k),...T.final.map((_,k)=>"f"+k),...c.extra.map((_,k)=>"x"+k)]}
function capDone(id){return ck("cap-"+id)}
function setCap(id,k,on){setCk("cap-"+id,k,on)}
let openCap=null;
function capSection(){
  const t=todayStr(); const next=CAPDAYS.find(c=>c.d>=t);
  if(openCap===null && next) openCap=next.id;
  const group=(c,title,list,p)=>{const dn=capDone(c.id);return list.length?`<h3>${title}</h3>${list.map((x,k)=>{const key=p+k;return `<div class="check${dn.includes(key)?" done":""}"><input type="checkbox" id="cp-${c.id}-${key}" data-cap="${c.id}" data-k="${key}"${dn.includes(key)?" checked":""}><label for="cp-${c.id}-${key}">${esc(x)}</label></div>`}).join("")}`:""};
  return `<h2 id="aoVivo">Dias ao vivo</h2>
    <p class="note">Checklist para quem estiver filmando com você. ${esc(CAPRULES)}</p>
    <div class="stack">${CAPDAYS.map(c=>{const T=TEMPLATES[c.tipo];const dn=capDone(c.id);const total=capKeys(c).length;const isNext=next&&next.id===c.id;
      return `<details class="card sess${isNext?" feature":""}"${c.id===openCap?" open":""} data-capday="${c.id}"${c.d<t&&!isNext?' style="opacity:.7"':""}>
        <summary><div class="row"><span class="when">${isNext?"Próximo · ":""}${fmt(c.d)}</span><span class="chip">${dn.length}/${total}</span></div>
        <div class="title" style="margin-bottom:2px">${esc(c.t)}</div><div class="note">Alimenta: ${esc(c.feeds)}</div></summary>
        <div class="sess-body">
          <div class="callout"><b>Antes de tudo:</b> ${esc(T.abertura)}</div>
          ${group(c,"Antes",T.antes,"a")}
          ${group(c,"Durante · momentos para caçar",T.durante,"d")}
          ${group(c,"No final",T.final,"f")}
          ${T.perguntas.length?`<p class="note" style="margin:8px 0 0"><b>Perguntas do depoimento:</b> ${T.perguntas.map(esc).join(" · ")}</p>`:""}
          ${group(c,"Específico deste dia",c.extra,"x")}
          ${T.cuidado?`<p class="note" style="margin:10px 0 0"><b>Cuidado:</b> ${esc(T.cuidado)}</p>`:""}
        </div>
      </details>`}).join("")}</div>`;
}

function renderGrav(){
  const t = todayStr();
  const next = SESSIONS.find(s=>s.d>=t);
  if(openSess===null && next) openSess = next.id;
  $("#v-grav").innerHTML = `<h2>Dia de gravação</h2>
    <p class="note">Abra a sessão do dia e grave de cima para baixo. Marcou, o calendário já mostra como Gravado.</p>
    <div class="stack">${SESSIONS.map(s=>{
      const its = s.it.map(id=>byId[id]).sort((a,b)=>grp(a)-grp(b)||a.d.localeCompare(b.d));
      const done = its.filter(i=>st(i.id)>=1).length;
      const past = s.d < t, isNext = next && s.id===next.id;
      const blocos = BLOCOS.map(b=>({b,list:its.filter(i=>grp(i)===b.k)})).filter(x=>x.list.length);
      return `<details class="card sess${isNext?" feature":""}"${s.id===openSess?" open":""} data-sess="${s.id}"${past&&!isNext?' style="opacity:.7"':""}>
        <summary><div class="row"><span class="when">${isNext?"Próxima · ":""}${fmt(s.d)} · ${esc(s.dur)}</span>${its.length?`<span class="chip">${done}/${its.length}</span>`:""}</div>
        <div class="title" style="margin-bottom:2px">${esc(s.l)}</div>
        <div class="note">${its.length?its.map(i=>esc(i.n)).join(" · "):"Sem vídeos novos"}</div>

          <p class="note" style="margin:10px 0 0"><b>Precisa de:</b> ${esc(s.need)}</p>
          ${blocos.map((x,n)=>`<h3>Bloco ${n+1} · ${esc(x.b.t)}</h3><p class="note" style="margin:0 0 8px">${esc(x.b.d)}</p><div class="stack">${x.list.map(videoCard).join("")}</div>`).join("")}

    ${capSection()}`;
}

let storyDate = null;
const CICLO_INICIO = "2026-10-05";
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/86400000)}
function storySteps(ds){
  const steps=[];
  const post=ITEMS.find(i=>i.d===ds);
  const cap=CAPDAYS.find(c=>c.d===ds);
  const tea=TEATRO.find(([x])=>x===ds);
  if(post){
    const r=resolved(post);
    const k=post.id && !r.swapped ? STORYKIT[post.id] : null;
    const kit=k || {m:"Hoje tem vídeo novo. "+r.h, c:r.t, i:["Caixinha", /^Sem pergunta|^Opcional/.test(r.q)?"O que você achou?":r.q.replace(/^Legenda: /,"")], f:"Obrigada por cada resposta de hoje."};
    steps.push({h:"Manhã",t:"Rosto falando, antes do post",f:kit.m});
    steps.push({h:"1–2h depois do post",t:"Chamada do "+post.n+" (compartilhe o post)",f:kit.c});
    steps.push({h:"Tarde",t:kit.i[0],f:kit.i[1]});
    steps.push({h:"Noite",t:"Fecho com rosto",f:kit.f});
  } else {
    const dk=DAYKIT[ds];
    if(dk){
      steps.push({h:"Manhã",t:dk.t,f:dk.m});
      steps.push({h:"Tarde",t:dk.i[0],f:dk.i[1]});
      steps.push({h:"Noite",t:"Fecho com rosto",f:dk.f});
    } else {
      const last=[...ITEMS].filter(i=>i.d<ds).pop();
      if(last){ const r=resolved(last);
        steps.push({h:"Manhã",t:"Respostas do último post",f:`Muita gente respondeu o post de ${fmt(last.d)}. Separei algumas respostas.`});
        steps.push({h:"Tarde",t:"Caixinha",f:/^Sem pergunta|^Opcional|^Legenda/.test(r.q)?"O que você quer ver aqui essa semana?":r.q});
        steps.push({h:"Noite",t:"Fecho com rosto",f:"O que ficou do dia, em uma frase."});
      }
    }
  }
  if(tea) steps.splice(1,0,{h:"Combinado",t:"Teatro da Ilha",f:tea[1],hl:1,plain:1});
  if(ds>="2026-10-11" && ds<"2026-10-24"){const n=daysBetween(ds,"2026-10-24"); steps.push({h:"Série",t:"Diário de SJC",plain:1,f:`“Diário de SJC · faltam ${n} ${n===1?"dia":"dias"}”: um bastidor da preparação.`})}
  if(ds>="2026-10-26" && ds<"2026-10-31"){const n=daysBetween(ds,"2026-10-31"); steps.push({h:"Série",t:"Contagem pro Club",plain:1,f:`“Contagem pro Club · faltam ${n}”: um detalhe da Oficina de Velas.`})}
  if(cap && !DAYKIT[ds]) steps.push({h:"Ao vivo",t:cap.t,plain:1,f:"Stories ao vivo do seu celular: chegada, um momento no meio, o resultado no fim.",hl:1});
  return steps;
}
function renderStories(){
  const t=todayStr(); if(!storyDate) storyDate = t<CICLO_INICIO ? CICLO_INICIO : t;
  if(storyDate<CICLO_INICIO) storyDate=CICLO_INICIO;
  const back=addDays(t,-3); const start = back<CICLO_INICIO ? CICLO_INICIO : back;
  const strip=[...Array(17)].map((_,k)=>addDays(start,k));
  const sd=parse(storyDate), steps=storySteps(storyDate);
  const key="dia-"+storyDate, done=ck(key);
  const post=ITEMS.find(i=>i.d===storyDate);
  $("#v-stories").innerHTML = `<h2>Stories</h2>
    <div class="row" style="margin:4px 0 8px"><button class="btn ghost" type="button" data-sday="${addDays(storyDate,-1)}" aria-label="Dia anterior"${storyDate<=CICLO_INICIO?" disabled":""}>‹ anterior</button>
      <label class="note" for="storyPick" style="display:flex;gap:6px;align-items:center">Ir para <input id="storyPick" type="date" min="${CICLO_INICIO}" value="${storyDate}" style="font:inherit;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--surface);color:var(--ink)"></label>
      <button class="btn ghost" type="button" data-sday="${addDays(storyDate,1)}" aria-label="Próximo dia">próximo ›</button></div>
    <div class="days" role="group" aria-label="Escolher dia">${strip.map(x=>{const dx=parse(x);return `<button type="button" data-sday="${x}" aria-pressed="${x===storyDate}" class="${x===t?"today":""}"><span>${DOW[dx.getDay()]}</span><b>${dx.getDate()}</b>${(TEATRO.some(([y])=>y===x)||CAPDAYS.some(c=>c.d===x))?'<i aria-hidden="true"></i>':""}</button>`}).join("")}</div>
    <h3>${storyDate===t?"Hoje · ":""}${DOWL[sd.getDay()]}, ${sd.getDate()} de ${MON[sd.getMonth()]} · ${done.length}/${steps.length}</h3>
    ${post?`<p class="note" style="margin:-4px 0 10px">No feed: <b>${esc(post.n)} · ${esc(resolved(post).t)}</b></p>`:`<p class="note" style="margin:-4px 0 10px">Sem post no feed hoje.</p>`}
    <div class="stack">${steps.map((s,k)=>`<div class="card story${s.hl?" feature":""}${done.includes(k)?" done-card":""}">
      <div class="check" style="border:0;padding:0"><input type="checkbox" id="st-${k}" data-daily="${k}" data-day="${storyDate}"${done.includes(k)?" checked":""}>
      <label for="st-${k}"><span class="when">${esc(s.h)} · ${esc(s.t)}</span><span class="phrase">${s.plain?esc(s.f):"“"+esc(s.f)+"”"}</span></label></div>
    </div>`).join("")}</div>
    <p class="note" style="margin-top:12px">Entre esses, mostre a vida acontecendo como você já faz: trabalho, aula, time, rotina. As frases são ponto de partida; fale do seu jeito.</p>
    <details class="card" style="margin-top:10px"><summary>Regras de sempre</summary><ul class="plain" style="margin:8px 0 0">
      <li>Rosto falando em pelo menos 3 Stories por dia.</li>
      <li>Texto na tela em todo Story com fala.</li>
      <li>No máximo 1 Story de venda a cada 5–6; link só com vaga ou data aberta.</li>
    </ul></details>`;
}

function renderIdeias(){
  const sorted = [...ideas].sort((a,b)=>(b.criada||0)-(a.criada||0));
  $("#v-ideias").innerHTML = `${bankSection()}
    <h2>Banco de ideias</h2>
    <p class="note">Qualquer pensamento entra aqui na hora. Depois a gente encaixa no calendário.</p>
    <form class="idea-form" id="ideaForm">
      <label for="ideaText" class="note">Nova ideia</label>
      <textarea id="ideaText" placeholder="Ex.: uma aluna disse que tem medo de passar batom vermelho…" maxlength="1000"></textarea>
      <button class="btn" type="submit">Guardar ideia</button>
    </form>
    <h3>${sorted.length} ${sorted.length===1?"ideia":"ideias"}</h3>
    ${sorted.length?`<div class="stack">${sorted.map(x=>`<div class="card idea"><p>${esc(x.texto)}<time>${x.criada?new Date(x.criada).toLocaleDateString("pt-BR",{day:"numeric",month:"short"}):""}</time></p><button class="btn ghost" data-del="${esc(x.id)}" aria-label="Apagar ideia">Apagar</button></div>`).join("")}</div>`:`<div class="empty">Nenhuma ideia guardada ainda. A primeira que surgir no dia, coloque aqui.</div>`}
    <h3>Backup</h3>
    <p class="note">${fs?"Sincronizado pelo Firebase entre os aparelhos. Exporte de vez em quando para ter uma cópia.":"Sem Firebase, tudo fica salvo só neste celular. Exporte e importe para levar a outro aparelho."}</p>
    <div class="row" style="justify-content:flex-start;flex-wrap:wrap">
      <button class="btn" type="button" id="exportBtn">Exportar backup</button>
      <label class="btn ghost file-btn" for="importFile" style="border:1px solid var(--line);padding:9px 14px">Importar backup</label>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <p class="note" id="backupMsg"></p>`;
}

function render(){
  ({hoje:renderHoje,cal:renderCal,grav:renderGrav,stories:renderStories,ideias:renderIdeias})[view]();
}
function renderAll(){ renderHoje(); renderCal(); renderGrav(); if(view==="ideias") renderIdeias(); }

/* ---------- listas marcadas (roteiro do dia, teatro, dias ao vivo) ---------- */
const checks = {}; // chave -> lista de itens marcados
function ck(key){ return checks[key] || [] }
function setCk(key,k,on){ let a=ck(key).filter(x=>x!==k); if(on) a.push(k); checks[key]=a; persistCheck(key) }
function setList(key,arr){ checks[key]=arr; persistCheck(key) }
function dailyDone(k,day){ return ck("dia-"+(day||todayStr())).includes(k) }
function setDaily(k,on,day){ setCk("dia-"+(day||todayStr()),k,on) }
function teaDone(k){ return ck("teatro").includes(k) }
function setTea(k,on){ setCk("teatro",k,on) }

/* ---------- armazenamento: Firebase quando configurado, senão o próprio celular ---------- */
let fs = null;
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function setSync(t){ const el=$("#sync"); if(el) el.textContent=t }
function failed(e){ setSync(e && e.code==="permission-denied" ? "sem permissão: confira as regras do Firebase" : "não salvou, tente de novo") }

function persistCheck(key){
  if(fs) fs.collection("checks").doc(key).set({v:checks[key],t:Date.now()}).catch(failed);
  else lsSet("handem-checks",checks);
}
async function setStatus(id,v){
  state[id]=v; renderAll(); if(view==="stories") renderStories();
  if(fs) fs.collection("estado").doc(id).set({s:v,t:Date.now()}).catch(failed);
  else lsSet("handem-estado",state);
}
async function addIdea(texto){
  if(fs){ fs.collection("ideias").add({texto,criada:Date.now()}).catch(failed) }
  else { ideas.push({id:"l"+Date.now(),texto,criada:Date.now()}); lsSet("handem-ideias",ideas); renderIdeias(); }
}
async function delIdea(id){
  if(fs){ fs.collection("ideias").doc(id).delete().catch(failed) }
  else { const k=ideas.findIndex(x=>x.id===id); if(k>-1) ideas.splice(k,1); lsSet("handem-ideias",ideas); renderIdeias(); }
}

/* ---------- backup ---------- */
function exportBackup(){
  const data={versao:2,exportado:new Date().toISOString(),estado:state,ideias:ideas,checks};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="central-handem-backup-"+todayStr()+".json";
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  $("#backupMsg").textContent="Backup gerado.";
}
function importBackup(file){
  const r=new FileReader();
  r.onload=async()=>{ try{ const d=JSON.parse(r.result); if(!d||typeof d.estado!=="object") throw 0;
    if(fs){
      const b=fs.batch(); let n=0;
      for(const id in d.estado){ b.set(fs.collection("estado").doc(id),{s:d.estado[id],t:Date.now()}); n++ }
      for(const key in (d.checks||{})){ b.set(fs.collection("checks").doc(key),{v:d.checks[key],t:Date.now()}); n++ }
      (d.ideias||[]).forEach(x=>{ b.set(fs.collection("ideias").doc(String(x.id)),{texto:String(x.texto||""),criada:x.criada||Date.now()}); n++ });
      if(n>450) throw 0; await b.commit();
    } else {
      for(const k in state) delete state[k]; Object.assign(state,d.estado); lsSet("handem-estado",state);
      ideas.length=0; (d.ideias||[]).forEach(x=>ideas.push(x)); lsSet("handem-ideias",ideas);
      for(const k in checks) delete checks[k]; Object.assign(checks,d.checks||{}); lsSet("handem-checks",checks);
      renderAll(); renderStories(); renderIdeias();
    }
    $("#backupMsg").textContent="Backup importado.";
  }catch(e){ $("#backupMsg").textContent="Esse arquivo não é um backup da Central. Escolha o .json exportado pelo app."; } };
  r.readAsText(file);
}

/* ---------- Firebase: entra sozinho (anônimo), sem tela de login ---------- */
function startFirebase(){
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const auth=firebase.auth();
  const db=firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  let unsubs=[];
  setSync("conectando…");
  auth.onAuthStateChanged(user=>{
    unsubs.forEach(u=>u()); unsubs=[];
    if(!user){ auth.signInAnonymously().catch(()=>setSync("sem conexão, salvo no aparelho")); return }
    fs=db; setSync("sincronizando…");
    const onErr=e=>{ setSync(e&&e.code==="permission-denied"?"sem permissão: confira as regras do Firebase":"sem conexão, salvo no aparelho") };
    unsubs.push(db.collection("estado").onSnapshot({includeMetadataChanges:true},snap=>{
      for(const k in state) delete state[k];
      snap.docs.forEach(d=>{const v=d.data(); if(v&&typeof v.s==="number") state[d.id]=v.s});
      setSync(snap.metadata.fromCache ? (navigator.onLine===false?"offline, sincroniza ao voltar":"conectando…") : "sincronizado");
      renderAll(); if(view==="stories") renderStories();
    },onErr));
    unsubs.push(db.collection("checks").onSnapshot({includeMetadataChanges:true},snap=>{
      for(const k in checks) delete checks[k];
      snap.docs.forEach(d=>{const v=d.data(); if(v&&Array.isArray(v.v)) checks[d.id]=v.v});
      renderAll(); if(view==="stories") renderStories();
    },onErr));
    unsubs.push(db.collection("ideias").onSnapshot({includeMetadataChanges:true},snap=>{
      ideas.length=0; snap.docs.forEach(d=>{const v=d.data(); if(v) ideas.push({id:d.id,texto:String(v.texto||""),criada:v.criada})});
      if(view==="ideias") renderIdeias();
    },onErr));
  });
}

/* ---------- eventos ---------- */
document.addEventListener("change",e=>{
  if(e.target.id==="importFile"){ if(e.target.files[0]) importBackup(e.target.files[0]); e.target.value=""; return }
  const s=e.target.closest("[data-st]"); if(s){ setStatus(s.dataset.st,Number(s.value)); return }
  const r=e.target.closest("[data-rec]"); if(r){ const id=r.dataset.rec; const cur=st(id); setStatus(id, r.checked ? Math.max(cur,1) : 0); return }
  const cp=e.target.closest("[data-cap]"); if(cp){ setCap(cp.dataset.cap,cp.dataset.k,cp.checked); renderGrav(); return }
  const tq=e.target.closest("[data-tea]"); if(tq){ setTea(Number(tq.dataset.tea),tq.checked); return }
  const dl=e.target.closest("[data-daily]"); if(dl){ setDaily(Number(dl.dataset.daily),dl.checked,dl.dataset.day); if(view==="stories") renderStories(); else dl.closest(".check").classList.toggle("done",dl.checked); return }
  if(e.target.id==="storyPick"){ if(e.target.value){ storyDate = e.target.value<CICLO_INICIO ? CICLO_INICIO : e.target.value; renderStories() } return }
  const c=e.target.closest(".check input"); if(c){ c.closest(".check").classList.toggle("done",c.checked) }
});
document.addEventListener("toggle",e=>{ const d=e.target; if(d.matches && d.matches("details[data-sess]") && d.open) openSess=d.dataset.sess; if(d.matches && d.matches("details[data-capday]") && d.open) openCap=d.dataset.capday; },true);
document.addEventListener("click",e=>{
  const t=e.target.closest("nav.tabs button"); if(t){ view=t.dataset.v; document.querySelectorAll("nav.tabs button").forEach(b=>{ if(b===t) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current") }); document.querySelectorAll("main>section").forEach(sec=>sec.hidden = sec.id!=="v-"+view); render(); try{localStorage.setItem("handem-view",view)}catch(_){} window.scrollTo(0,0); return }
  const g=e.target.closest("[data-gocap]"); if(g){ openCap=g.dataset.gocap; document.querySelector('nav.tabs button[data-v="grav"]').click(); setTimeout(()=>{const el=document.querySelector(`[data-capday="${openCap}"]`); if(el) el.scrollIntoView({block:"start"})},50); return }
  const sdb=e.target.closest("[data-sday]"); if(sdb){ if(sdb.disabled) return; storyDate = sdb.dataset.sday<CICLO_INICIO ? CICLO_INICIO : sdb.dataset.sday; renderStories(); const p=document.querySelector('.days [aria-pressed="true"]'); if(p) p.scrollIntoView({inline:"center",block:"nearest"}); return }
  const sw=e.target.closest("[data-swap]"); if(sw){ const sel=document.getElementById("sw-"+sw.dataset.swap); if(sel&&sel.value){ ITEMS.forEach(i=>{ if(ck("troca-"+i.id)[0]===sw.dataset.swap) setList("troca-"+i.id,[]) }); setList("troca-"+sel.value,[sw.dataset.swap]); renderAll(); renderIdeias(); sw.textContent="Trocado ✓" } return }
  const us=e.target.closest("[data-unswap]"); if(us){ setList("troca-"+us.dataset.unswap,[]); renderAll(); if(view==="ideias") renderIdeias(); return }
  const bs=e.target.closest("[data-bserie]"); if(bs){ bankSerie=bs.dataset.bserie; renderIdeias(); return }
  const f=e.target.closest("[data-f]"); if(f){ filter=f.dataset.f; renderCal(); return }
  const d=e.target.closest("[data-del]"); if(d){ delIdea(d.dataset.del); return }
  if(e.target.id==="exportBtn"){ exportBackup(); return }
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="ideaForm") return; e.preventDefault();
  const ta=$("#ideaText"); const v=ta.value.trim(); if(!v) return; ta.value=""; addIdea(v);
});

/* ---------- início ---------- */
(function init(){
  try{ const v=localStorage.getItem("handem-view"); if(v && ["hoje","cal","grav","stories","ideias"].includes(v)) view=v }catch(_){}
  document.querySelectorAll("nav.tabs button").forEach(b=>{ if(b.dataset.v===view) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current") });
  document.querySelectorAll("main>section").forEach(sec=>sec.hidden = sec.id!=="v-"+view);
  renderAll(); renderStories(); renderIdeias(); render();
  Object.assign(state,lsGet("handem-estado",{})); ideas.push(...lsGet("handem-ideias",[])); Object.assign(checks,lsGet("handem-checks",{}));
  if(window.FIREBASE_CONFIG && window.firebase){ try{ startFirebase() }catch(e){ setSync("salvo neste celular") } } else setSync("salvo neste celular");
  renderAll(); renderStories(); renderIdeias(); render();
  if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})) }
})();
</script>
